<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Editor - LesuikGame</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f1f1;
  color: #222;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  height: 56px;
  background: #111118;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

.logo:hover {
  opacity: .85;
}

.logo span {
  color: #ff315d;
}

.back {
  color: #ccc;
  text-decoration: none;
  font-size: 13px;
}

.back:hover {
  color: white;
}


/* =========================
   FILE BAR
========================= */

.filebar {
  background: white;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  border-bottom: 1px solid #ddd;
}

.filebar input {
  border: none;
  outline: none;
  font-size: 16px;
  width: 350px;
  padding: 7px;
}

.file-icon {
  margin-right: 8px;
}


/* =========================
   TABS
========================= */

.tabs {
  background: white;
  height: 43px;
  display: flex;
  align-items: center;
  padding-left: 20px;
  border-bottom: 1px solid #ddd;
}

.tab {
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
}

.tab:hover {
  background: #eee;
}

.tab.active {
  color: #ff315d;
  font-weight: bold;
  border-bottom: 3px solid #ff315d;
}


/* =========================
   RIBBON
========================= */

.ribbon {
  background: #fafafa;
  border-bottom: 1px solid #ccc;
  min-height: 82px;
  padding: 8px 18px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
}

.ribbon-group {
  border-right: 1px solid #ddd;
  padding-right: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: max-content;
}

.ribbon-buttons {
  display: flex;
  align-items: center;
  gap: 4px;
}

.group-title {
  text-align: center;
  font-size: 10px;
  color: #777;
  margin-top: 5px;
}

.tool {
  min-width: 34px;
  height: 34px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

.tool:hover {
  background: #e5e5e5;
  border-color: #ccc;
}

.tool.big {
  font-size: 17px;
}

select {
  height: 34px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
  padding: 0 8px;
}

.color-input {
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  cursor: pointer;
}


/* =========================
   WORKSPACE
========================= */

.workspace {
  padding: 25px;
  min-height: calc(100vh - 230px);
}


/* =========================
   PAPER
========================= */

.paper {
  background: white;
  width: 850px;
  min-height: 1100px;
  margin: 0 auto;
  padding: 70px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}


/* =========================
   TITLE
========================= */

.article-title {
  width: 100%;
  border: none;
  outline: none;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 35px;
  color: #111;
}

.article-title::placeholder {
  color: #aaa;
}


/* =========================
   EDITOR
========================= */

.editor {
  min-height: 850px;
  outline: none;
  font-size: 17px;
  line-height: 1.8;
  color: #222;
}

.editor:empty:before {
  content: "Mulai menulis artikel di sini...";
  color: #aaa;
}

.editor img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 20px auto;
}

.editor table {
  border-collapse: collapse;
  width: 100%;
  margin: 20px 0;
}

.editor td,
.editor th {
  border: 1px solid #888;
  padding: 8px;
}


/* =========================
   BOTTOM BAR
========================= */

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: #111118;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
}

.bottom button {
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

.draft {
  background: #444;
  color: white;
}

.publish {
  background: #ff315d;
  color: white;
}


/* =========================
   STATUS
========================= */

.status {
  position: fixed;
  bottom: 65px;
  right: 20px;
  background: #222;
  color: white;
  padding: 10px 15px;
  border-radius: 6px;
  display: none;
  font-size: 13px;
}


/* =========================
   MODAL HOME
========================= */

.home-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 99999;
  align-items: center;
  justify-content: center;
}

.home-modal-box {
  width: 390px;
  max-width: calc(100% - 40px);
  background: white;
  border-radius: 14px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  animation: popup .2s ease;
}

.home-modal-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

.home-modal-box h2 {
  margin: 5px 0 10px;
  color: #222;
  font-size: 22px;
}

.home-modal-box p {
  margin: 0 0 25px;
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

.home-modal-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.home-modal-buttons button {
  border: none;
  padding: 11px 22px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
}

.btn-cancel {
  background: #eee;
  color: #333;
}

.btn-home {
  background: #ff315d;
  color: white;
}

.btn-cancel:hover {
  background: #ddd;
}

.btn-home:hover {
  background: #d91038;
}

@keyframes popup {
  from {
    opacity: 0;
    transform: scale(.9);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {

  .paper {
    width: 100%;
    padding: 35px;
  }

  .workspace {
    padding: 10px;
  }

  .article-title {
    font-size: 26px;
  }

}

@media(max-width: 600px) {

  .topbar {
    padding: 0 12px;
  }

  .back {
    display: none;
  }

  .filebar input {
    width: 100%;
  }

  .paper {
    padding: 25px;
    min-height: 900px;
  }

  .ribbon {
    padding: 8px;
  }

}
</style>
</head>

<!-- =========================

<div

<script>

/* =========================
   FORMAT
========================= */

function format(command, value = null) {

  document.execCommand(
    command,
    false,
    value
  );

  document.getElementById(
    "editor"
  ).focus();

}


/* =========================
   HEADING
========================= */

function heading(type) {

  document.execCommand(
    "formatBlock",
    false,
    type
  );

  document.getElementById(
    "editor"
  ).focus();

}


/* =========================
   UNDO
========================= */

function undo() {

  document.execCommand("undo");

}


/* =========================
   REDO
========================= */

function redo() {

  document.execCommand("redo");

}


/* =========================
   LINK
========================= */

function addLink() {

  const url = prompt(
    "Masukkan URL:"
  );

  if (!url) return;

  document.execCommand(
    "createLink",
    false,
    url
  );

}


/* =========================
   IMAGE
========================= */

function insertImage() {

  const input =
    document.createElement("input");

  input.type = "file";
  input.accept = "image/*";

  input.onchange = function() {

    const file =
      input.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload =
      function(e) {

        document.execCommand(
          "insertImage",
          false,
          e.target.result
        );

      };

    reader.readAsDataURL(file);

  };

  input.click();

}


/* =========================
   TABLE
========================= */

function insertTable() {

  const rows =
    prompt(
      "Jumlah baris:",
      "3"
    );

  const cols =
    prompt(
      "Jumlah kolom:",
      "3"
    );

  if (!rows || !cols) return;

  let html = "<table>";

  for (
    let i = 0;
    i < Number(rows);
    i++
  ) {

    html += "<tr>";

    for (
      let j = 0;
      j < Number(cols);
      j++
    ) {

      html +=
        "<td>&nbsp;</td>";

    }

    html += "</tr>";

  }

  html += "</table>";

  document.execCommand(
    "insertHTML",
    false,
    html
  );

}


/* =========================
   LINE
========================= */

function insertLine() {

  document.execCommand(
    "insertHorizontalRule"
  );

}


/* =========================
   PASTE
========================= */

function pasteText() {

  navigator.clipboard
    .readText()
    .then(function(text) {

      document.execCommand(
        "insertText",
        false,
        text
      );

    })
    .catch(function() {

      alert(
        "Browser tidak mengizinkan paste otomatis. Gunakan Ctrl + V."
      );

    });

}


/* =========================
   TABS
========================= */

function showTab(tab) {

  document
    .querySelectorAll(".tab")
    .forEach(function(el) {

      el.classList.remove(
        "active"
      );

    });


  document
    .querySelectorAll(".ribbon")
    .forEach(function(el) {

      el.style.display =
        "none";

    });


  const tabs =
    document.querySelectorAll(
      ".tab"
    );


  if (tab === "home") {

    tabs[0]
      .classList
      .add("active");

    document.getElementById(
      "homeRibbon"
    ).style.display = "flex";

  }


  if (tab === "insert") {

    tabs[1]
      .classList
      .add("active");

    document.getElementById(
      "insertRibbon"
    ).style.display = "flex";

  }


  if (tab === "format") {

    tabs[2]
      .classList
      .add("active");

    document.getElementById(
      "formatRibbon"
    ).style.display = "flex";

  }


  if (tab === "view") {

    tabs[3]
      .classList
      .add("active");

    document.getElementById(
      "viewRibbon"
    ).style.display = "flex";

  }

}


/* =========================
   SAVE DRAFT
========================= */

function saveDraft() {

  const data = {

    title:
      document.getElementById(
        "articleTitle"
      ).value,

    content:
      document.getElementById(
        "editor"
      ).innerHTML,

    fileName:
      document.getElementById(
        "fileName"
      ).value

  };


  localStorage.setItem(
    "lesuikgame_article_draft",
    JSON.stringify(data)
  );


  showStatus(
    "✅ Draft berhasil disimpan"
  );

}


/* =========================
   LOAD DRAFT
========================= */

window.onload = function() {

  const saved =
    localStorage.getItem(
      "lesuikgame_article_draft"
    );

  if (!saved) return;

  try {

    const data =
      JSON.parse(saved);


    document.getElementById(
      "articleTitle"
    ).value =
      data.title || "";


    document.getElementById(
      "editor"
    ).innerHTML =
      data.content || "";


    document.getElementById(
      "fileName"
    ).value =
      data.fileName ||
      "Artikel Baru";

  }

  catch(e) {

    console.log(e);

  }

};


/* =========================
   STATUS
========================= */

function showStatus(text) {

  const status =
    document.getElementById(
      "status"
    );

  status.innerText = text;

  status.style.display =
    "block";


  setTimeout(
    function() {

      status.style.display =
        "none";

    },
    2500
  );

}


/* =========================
   PUBLISH
========================= */

function publish() {

  const title =
    document.getElementById(
      "articleTitle"
    ).value.trim();


  const content =
    document.getElementById(
      "editor"
    ).innerHTML.trim();


  if (!title) {

    alert(
      "Silakan masukkan judul artikel."
    );

    return;

  }


  if (!content) {

    alert(
      "Silakan tulis isi artikel."
    );

    return;

  }


  showStatus(
    "🚀 Artikel siap dipublish"
  );

}


/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen() {

  const paper =
    document.getElementById(
      "paper"
    );


  if (!document.fullscreenElement) {

    if (
      paper.requestFullscreen
    ) {

      paper.requestFullscreen();

    }

  }

  else {

    document.exitFullscreen();

  }

}


/* =========================
   PREVIEW
========================= */

function previewArticle() {

  const title =
    document.getElementById(
      "articleTitle"
    ).value;


  const content =
    document.getElementById(
      "editor"
    ).innerHTML;


  const win =
    window.open(
      "",
      "_blank"
    );


  if (!win) {

    alert(
      "Popup diblokir browser. Izinkan popup untuk melihat preview."
    );

    return;

  }


  win.document.write(`

<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<title>${escapeHtml(title)}</title>

<style>

body {
  max-width: 850px;
  margin: 50px auto;
  padding: 20px;
  font-family: Arial, sans-serif;
  line-height: 1.8;
  color: #222;
}

h1 {
  font-size: 36px;
}

img {
  max-width: 100%;
  height: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
}

td,
th {
  border: 1px solid #888;
  padding: 8px;
}

</style>

</head>

<body>

<h1>${escapeHtml(title)}</h1>

${content}

</body>

</html>

  `);


  win.document.close();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =========================
   KONFIRMASI HOME
========================= */

function confirmHome() {

  document.getElementById(
    "homeModal"
  ).style.display = "flex";

}


/* =========================
   TUTUP MODAL
========================= */

function closeHomeModal() {

  document.getElementById(
    "homeModal"
  ).style.display = "none";

}


/* =========================
   KEMBALI KE HOME
========================= */

function goHome() {

  window.location.href =
    "../index.html";

}


/* =========================
   KLIK AREA LUAR MODAL
========================= */

document
  .getElementById("homeModal")
  .addEventListener(
    "click",
    function(e) {

      if (e.target === this) {

        closeHomeModal();

      }

    }
  );


/* =========================
   TOMBOL ESC
========================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Escape") {

      closeHomeModal();

    }

  }
);

</script>

</body>
</html>
