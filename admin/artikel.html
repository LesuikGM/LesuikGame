<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Editor - LesuikGame</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f1f1;
  color: #222;
}

/* TOP BAR */
.topbar {
  height: 56px;
  background: #111118;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #ff315d;
}

.back {
  color: #ccc;
  text-decoration: none;
  font-size: 13px;
}

/* FILE NAME */
.filebar {
  background: white;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  border-bottom: 1px solid #ddd;
}

.filebar input {
  border: none;
  outline: none;
  font-size: 16px;
  width: 350px;
  padding: 7px;
}

.file-icon {
  margin-right: 8px;
}

/* RIBBON TABS */
.tabs {
  background: #fff;
  height: 43px;
  display: flex;
  align-items: center;
  padding-left: 20px;
  border-bottom: 1px solid #ddd;
}

.tab {
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
}

.tab:hover {
  background: #eee;
}

.tab.active {
  color: #ff315d;
  font-weight: bold;
  border-bottom: 3px solid #ff315d;
}

/* RIBBON */
.ribbon {
  background: #fafafa;
  border-bottom: 1px solid #ccc;
  min-height: 82px;
  padding: 8px 18px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
}

.ribbon-group {
  border-right: 1px solid #ddd;
  padding-right: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: max-content;
}

.ribbon-buttons {
  display: flex;
  align-items: center;
  gap: 4px;
}

.group-title {
  text-align: center;
  font-size: 10px;
  color: #777;
  margin-top: 5px;
}

.tool {
  min-width: 34px;
  height: 34px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

.tool:hover {
  background: #e5e5e5;
  border-color: #ccc;
}

.tool.big {
  font-size: 17px;
}

select {
  height: 34px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
  padding: 0 8px;
}

.color-input {
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  cursor: pointer;
}

/* WORKSPACE */
.workspace {
  padding: 25px;
  min-height: calc(100vh - 230px);
}

/* PAPER */
.paper {
  background: white;
  width: 850px;
  min-height: 1100px;
  margin: 0 auto;
  padding: 70px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}

/* TITLE */
.article-title {
  width: 100%;
  border: none;
  outline: none;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 35px;
  color: #111;
}

/* EDITOR */
.editor {
  min-height: 850px;
  outline: none;
  font-size: 17px;
  line-height: 1.8;
  color: #222;
}

.editor:empty:before {
  content: "Mulai menulis artikel di sini...";
  color: #aaa;
}

.editor img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 20px auto;
}

.editor table {
  border-collapse: collapse;
  width: 100%;
  margin: 20px 0;
}

.editor td,
.editor th {
  border: 1px solid #888;
  padding: 8px;
}

/* BOTTOM */
.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: #111118;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
}

.bottom button {
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

.draft {
  background: #444;
  color: white;
}

.publish {
  background: #ff315d;
  color: white;
}

/* STATUS */
.status {
  position: fixed;
  bottom: 65px;
  right: 20px;
  background: #222;
  color: white;
  padding: 10px 15px;
  border-radius: 6px;
  display: none;
  font-size: 13px;
}

/* RESPONSIVE */
@media(max-width: 900px) {

  .paper {
    width: 100%;
    padding: 35px;
  }

  .workspace {
    padding: 10px;
  }

  .article-title {
    font-size: 26px;
  }

}

@media(max-width: 600px) {

  .topbar {
    padding: 0 12px;
  }

  .back {
    display: none;
  }

  .filebar input {
    width: 100%;
  }

  .paper {
    padding: 25px;
    min-height: 900px;
  }

  .ribbon {
    padding: 8px;
  }

}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">

  <div class="logo">
    LESUIK<span>GAME</span>
  </div>

  <a href="index.html" class="back">
    ← Dashboard
  </a>

</div>


<!-- FILE BAR -->
<div class="filebar">

  <span class="file-icon">📄</span>

  <input
    type="text"
    id="fileName"
    value="Artikel Baru"
    placeholder="Nama artikel"
  >

</div>


<!-- TABS -->
<div class="tabs">

  <div class="tab active" onclick="showTab('home')">
    Home
  </div>

  <div class="tab" onclick="showTab('insert')">
    Insert
  </div>

  <div class="tab" onclick="showTab('format')">
    Format
  </div>

  <div class="tab" onclick="showTab('view')">
    View
  </div>

</div>


<!-- HOME RIBBON -->
<div class="ribbon" id="homeRibbon">

  <!-- CLIPBOARD -->
  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool big" onclick="pasteText()" title="Paste">
        📋
      </button>

      <button class="tool" onclick="undo()" title="Undo">
        ↶
      </button>

      <button class="tool" onclick="redo()" title="Redo">
        ↷
      </button>

    </div>

    <div class="group-title">
      Clipboard
    </div>

  </div>


  <!-- FONT -->
  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <select onchange="format('fontName',this.value)">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Georgia">Georgia</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Times New Roman">Times New Roman</option>
      </select>

      <select onchange="format('fontSize',this.value)">
        <option value="3">12</option>
        <option value="4">14</option>
        <option value="5">18</option>
        <option value="6">24</option>
        <option value="7">32</option>
      </select>

      <button class="tool" onclick="format('bold')" title="Bold">
        <b>B</b>
      </button>

      <button class="tool" onclick="format('italic')" title="Italic">
        <i>I</i>
      </button>

      <button class="tool" onclick="format('underline')" title="Underline">
        <u>U</u>
      </button>

      <input
        type="color"
        class="color-input"
        onchange="format('foreColor',this.value)"
        title="Warna teks"
      >

      <input
        type="color"
        class="color-input"
        onchange="format('hiliteColor',this.value)"
        title="Highlight"
      >

    </div>

    <div class="group-title">
      Font
    </div>

  </div>


  <!-- PARAGRAPH -->
  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool" onclick="format('justifyLeft')">
        ≡
      </button>

      <button class="tool" onclick="format('justifyCenter')">
        ≡
      </button>

      <button class="tool" onclick="format('justifyRight')">
        ≡
      </button>

      <button class="tool" onclick="format('insertUnorderedList')">
        •☰
      </button>

      <button class="tool" onclick="format('insertOrderedList')">
        1☰
      </button>

      <button class="tool" onclick="format('outdent')">
        ⇤
      </button>

      <button class="tool" onclick="format('indent')">
        ⇥
      </button>

    </div>

    <div class="group-title">
      Paragraph
    </div>

  </div>


  <!-- STYLES -->
  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool" onclick="heading('h1')">
        H1
      </button>

      <button class="tool" onclick="heading('h2')">
        H2
      </button>

      <button class="tool" onclick="heading('h3')">
        H3
      </button>

      <button class="tool" onclick="heading('p')">
        ¶
      </button>

      <button class="tool" onclick="format('formatBlock','blockquote')">
        ❝
      </button>

    </div>

    <div class="group-title">
      Styles
    </div>

  </div>

</div>


<!-- INSERT RIBBON -->
<div class="ribbon" id="insertRibbon" style="display:none">

  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool big" onclick="insertImage()">
        🖼️
      </button>

      <button class="tool big" onclick="addLink()">
        🔗
      </button>

      <button class="tool big" onclick="insertTable()">
        ▦
      </button>

      <button class="tool big" onclick="insertLine()">
        ─
      </button>

    </div>

    <div class="group-title">
      Media
    </div>

  </div>

</div>


<!-- FORMAT RIBBON -->
<div class="ribbon" id="formatRibbon" style="display:none">

  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool" onclick="heading('h1')">
        Heading 1
      </button>

      <button class="tool" onclick="heading('h2')">
        Heading 2
      </button>

      <button class="tool" onclick="heading('h3')">
        Heading 3
      </button>

      <button class="tool" onclick="heading('p')">
        Paragraph
      </button>

    </div>

    <div class="group-title">
      Text Style
    </div>

  </div>

</div>


<!-- VIEW RIBBON -->
<div class="ribbon" id="viewRibbon" style="display:none">

  <div class="ribbon-group">

    <div class="ribbon-buttons">

      <button class="tool" onclick="toggleFullscreen()">
        ⛶ Fullscreen
      </button>

      <button class="tool" onclick="previewArticle()">
        👁 Preview
      </button>

    </div>

    <div class="group-title">
      View
    </div>

  </div>

</div>


<!-- WORKSPACE -->
<div class="workspace">

  <div class="paper" id="paper">

    <input
      type="text"
      class="article-title"
      id="articleTitle"
      placeholder="Judul Artikel"
    >

    <div
      class="editor"
      id="editor"
      contenteditable="true"
    ></div>

  </div>

</div>


<!-- STATUS -->
<div class="status" id="status"></div>


<!-- BOTTOM -->
<div class="bottom">

  <button class="draft" onclick="saveDraft()">
    💾 Simpan Draft
  </button>

  <button class="publish" onclick="publish()">
    🚀 Publish
  </button>

</div>


<script>

/* FORMAT */
function format(command, value = null) {

  document.execCommand(
    command,
    false,
    value
  );

  document.getElementById("editor").focus();

}


/* HEADING */
function heading(type) {

  document.execCommand(
    "formatBlock",
    false,
    type
  );

  document.getElementById("editor").focus();

}


/* UNDO */
function undo() {

  document.execCommand(
    "undo"
  );

}


/* REDO */
function redo() {

  document.execCommand(
    "redo"
  );

}


/* LINK */
function addLink() {

  const url = prompt(
    "Masukkan URL:"
  );

  if (!url) return;

  document.execCommand(
    "createLink",
    false,
    url
  );

}


/* IMAGE */
function insertImage() {

  const input =
    document.createElement("input");

  input.type = "file";
  input.accept = "image/*";

  input.onchange = function() {

    const file =
      input.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = function(e) {

      document.execCommand(
        "insertImage",
        false,
        e.target.result
      );

    };

    reader.readAsDataURL(file);

  };

  input.click();

}


/* TABLE */
function insertTable() {

  const rows =
    prompt("Jumlah baris:", "3");

  const cols =
    prompt("Jumlah kolom:", "3");

  if (!rows || !cols) return;

  let html =
    '<table>';

  for (
    let i = 0;
    i < Number(rows);
    i++
  ) {

    html += "<tr>";

    for (
      let j = 0;
      j < Number(cols);
      j++
    ) {

      html += "<td>&nbsp;</td>";

    }

    html += "</tr>";

  }

  html += "</table>";

  document.execCommand(
    "insertHTML",
    false,
    html
  );

}


/* LINE */
function insertLine() {

  document.execCommand(
    "insertHorizontalRule"
  );

}


/* PASTE TEXT */
function pasteText() {

  navigator.clipboard
    .readText()
    .then(text => {

      document.execCommand(
        "insertText",
        false,
        text
      );

    });

}


/* TABS */
function showTab(tab) {

  document
    .querySelectorAll(".tab")
    .forEach(el => {

      el.classList.remove("active");

    });


  document
    .querySelectorAll(".ribbon")
    .forEach(el => {

      el.style.display = "none";

    });


  const tabs =
    document.querySelectorAll(".tab");

  if (tab === "home") {

    tabs[0].classList.add("active");

    document.getElementById(
      "homeRibbon"
    ).style.display = "flex";

  }

  if (tab === "insert") {

    tabs[1].classList.add("active");

    document.getElementById(
      "insertRibbon"
    ).style.display = "flex";

  }

  if (tab === "format") {

    tabs[2].classList.add("active");

    document.getElementById(
      "formatRibbon"
    ).style.display = "flex";

  }

  if (tab === "view") {

    tabs[3].classList.add("active");

    document.getElementById(
      "viewRibbon"
    ).style.display = "flex";

  }

}


/* SAVE DRAFT */
function saveDraft() {

  const data = {

    title:
      document.getElementById(
        "articleTitle"
      ).value,

    content:
      document.getElementById(
        "editor"
      ).innerHTML,

    fileName:
      document.getElementById(
        "fileName"
      ).value

  };


  localStorage.setItem(
    "lesuikgame_article_draft",
    JSON.stringify(data)
  );


  showStatus(
    "✅ Draft berhasil disimpan"
  );

}


/* LOAD DRAFT */
window.onload = function() {

  const saved =
    localStorage.getItem(
      "lesuikgame_article_draft"
    );

  if (!saved) return;

  try {

    const data =
      JSON.parse(saved);

    document.getElementById(
      "articleTitle"
    ).value =
      data.title || "";

    document.getElementById(
      "editor"
    ).innerHTML =
      data.content || "";

    document.getElementById(
      "fileName"
    ).value =
      data.fileName ||
      "Artikel Baru";

  } catch(e) {

    console.log(e);

  }

};


/* STATUS */
function showStatus(text) {

  const status =
    document.getElementById("status");

  status.innerText = text;

  status.style.display = "block";

  setTimeout(function() {

    status.style.display = "none";

  }, 2500);

}


/* PUBLISH */
function publish() {

  const title =
    document.getElementById(
      "articleTitle"
    ).value.trim();

  const content =
    document.getElementById(
      "editor"
    ).innerHTML.trim();


  if (!title) {

    alert(
      "Silakan masukkan judul artikel."
    );

    return;

  }


  if (!content) {

    alert(
      "Silakan tulis isi artikel."
    );

    return;

  }


  showStatus(
    "🚀 Artikel siap dipublish"
  );

}


/* FULLSCREEN */
function toggleFullscreen() {

  const paper =
    document.getElementById("paper");

  if (!document.fullscreenElement) {

    paper.requestFullscreen();

  } else {

    document.exitFullscreen();

  }

}


/* PREVIEW */
function previewArticle() {

  const title =
    document.getElementById(
      "articleTitle"
    ).value;

  const content =
    document.getElementById(
      "editor"
    ).innerHTML;


  const win =
    window.open(
      "",
      "_blank"
    );

  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>${title}</title>
      <style>
        body {
          max-width: 850px;
          margin: 50px auto;
          padding: 20px;
          font-family: Arial;
          line-height: 1.8;
        }

        h1 {
          font-size: 36px;
        }

        img {
          max-width: 100%;
        }

        table {
          border-collapse: collapse;
          width: 100%;
        }

        td {
          border: 1px solid #888;
          padding: 8px;
        }
      </style>
    </head>

    <body>

      <h1>${title}</h1>

      ${content}

    </body>
    </html>
  `);

  win.document.close();

}

</script>

</body>
</html>
